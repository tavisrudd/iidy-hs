AWSTemplateFormatVersion: 2010-09-09
Parameters:
  PublicFavicon:
    Type: String
    Default: 'false'
  QuotedYes:
    Type: String
    Default: 'yes'
Mappings:
  Toggle:
    'on':
      Enabled: true
    'Off':
      Enabled: 'off'
Resources:
  TestInstance:
    Type: AWS::EC2::Instance
    Properties:
      Monitoring: true
      EbsOptimized: 'no'
      SourceDestCheck: true
      DisableApiTermination: 'TRUE'
