name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop --command bash -c 'cabal build all -Wall -Wcompat'

      - name: Run tests
        run: nix develop --command bash -c 'cabal test all --test-show-details=direct'

      - name: Smoke test binary
        run: |
          nix develop --command bash -c 'cabal run iidy-hs -- --help'
          nix develop --command bash -c 'cabal run iidy-hs -- --version'
