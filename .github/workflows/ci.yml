name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build and test
        run: nix develop --command make ci

  spec-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run PLT Redex spec tests
        run: cd spec && nix develop --command racket tests/run-all.rkt

      - name: Verify snapshot is up to date
        run: |
          cd spec && nix develop --command racket snapshot.rkt
          git diff --exit-code snapshot.json
